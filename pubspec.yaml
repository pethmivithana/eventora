name: eventora
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6

  # Firebase (Dart 3.5 compatible stable set)
  firebase_core: ^2.30.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0

  # State Management
  flutter_riverpod: ^2.4.10

  # Navigation
  go_router: ^13.2.0

  # Models & Helpers
  equatable: ^2.0.5

  # Fonts
  google_fonts: ^6.2.1

  # Local storage
  shared_preferences: ^2.2.2

  # Connectivity
  connectivity_plus: ^5.0.2

  # Animations
  flutter_animate: ^4.3.0

  # UI Components
  flutter_slidable: ^3.0.1
  shimmer: ^3.0.0

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true